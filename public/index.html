<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Materiais</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Navegação ────────────────────────────────── -->
  <nav>
    <h1>Controle de Materiais</h1>
    <div class="nav-links">
      <button class="nav-btn active" data-section="materiais">Materiais</button>
      <button class="nav-btn" data-section="clientes">Clientes</button>
    </div>
  </nav>

  <main>

    <!-- ══════════════ MATERIAIS ══════════════ -->
    <section id="sec-materiais" class="section active">
      <h2>Cadastro de Material</h2>

      <form id="form-material">
        <input type="hidden" id="mat-id" />
        <div class="form-group">
          <label for="mat-descricao">Descrição (até 100 caracteres)</label>
          <input type="text" id="mat-descricao" maxlength="100" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="mat-preco-compra">Preço de Compra (R$)</label>
            <input type="number" id="mat-preco-compra" step="0.01" min="0" required />
          </div>
          <div class="form-group">
            <label for="mat-preco-venda">Preço de Venda (R$)</label>
            <input type="number" id="mat-preco-venda" step="0.01" min="0" required />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-salvar-mat">Salvar</button>
          <button type="button" id="btn-cancelar-mat" class="secondary" style="display:none">Cancelar</button>
        </div>
      </form>

      <h2>Consulta de Materiais</h2>
      <div class="search-bar">
        <input type="text" id="busca-material" placeholder="Buscar por descrição..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Preço Compra</th>
              <th>Preço Venda</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-materiais"></tbody>
        </table>
      </div>
    </section>

    <!-- ══════════════ CLIENTES ══════════════ -->
    <section id="sec-clientes" class="section">
      <h2>Cadastro de Cliente</h2>

      <form id="form-cliente">
        <input type="hidden" id="cli-id" />
        <div class="form-group">
          <label for="cli-nome">Nome (até 60 caracteres)</label>
          <input type="text" id="cli-nome" maxlength="60" required />
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-salvar-cli">Salvar</button>
          <button type="button" id="btn-cancelar-cli" class="secondary" style="display:none">Cancelar</button>
        </div>
      </form>

      <h2>Consulta de Clientes</h2>
      <div class="search-bar">
        <input type="text" id="busca-cliente" placeholder="Buscar por nome..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-clientes"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ── Toast ─────────────────────────────────── -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
